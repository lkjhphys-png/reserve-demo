<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>瑋澤的預約網站</title>
  <meta name="description" content="瑋澤的預約網站，提供學生預約老師時段的功能">

  <link rel="stylesheet" href="index.css">
  <script src="index.js" defer></script>
</head>

<body>
  <header class="site-header">
    <div class="container header-inner">
      <h1>瑋澤的預約網站</h1>
      <span class="header-label"></span>
    </div>
  </header>

  <main class="container">
    <section class="intro">
      <p class="eyebrow">ONLINE BOOKING</p>  
      <p>請選擇日期與時段，並填寫資料。</p>
    </section>
    <section class="panel" id="login-section">
      <h3>登入帳號</h3>
      <p>請使用 Google 帳號登入後，再進行預約。</p>

      <div id="google-login-button"></div>

     <p id="login-status" role="status">尚未登入</p>
    </section>
    <section class="panel" id="booking-section">
      <h3>第一步：選擇時段</h3>

      <label for="booking-date">預約日期</label>
      <input type="date" id="booking-date" required>

      <div id="slots" class="slots" aria-live="polite"></div>
    </section>

    <section class="panel" id="form-section">
      <h3>第二步：填寫資料</h3>

      <form id="booking-form">
        <input type="hidden" id="selected-slot">

      <label for="class-name">班級</label>
      <input
        type="text"
        id="class-name"
        placeholder="例如：205"
        required
        minlength="3"
        maxlength="3"
        inputmode="numeric"
        pattern="[1-3](0[1-9]|1[0-9]|20)"
        title="請輸入101至120、201至220或301至320的班級代碼"
      >

        <label for="student-name">姓名</label>
        <input
          type="text"
          id="student-name"
          placeholder="請輸入姓名"
          required
          maxlength="50"
        >

        <label for="seat-number">座號</label>
        <input
          type="number"
          id="seat-number"
          min="1"
          max="100"
          placeholder="請輸入座號"
          required
        >

        <label for="student-email">學生電子郵件</label>
        <input
          type="email"
          id="student-email"
          placeholder="請輸入電子郵件"
          maxlength="254"
        >

        <button type="submit" id="submit-button">
          送出預約
        </button>

        <p id="message" role="status" aria-live="polite"></p>
      </form>
    </section>

  <!-- 預約成功畫面 -->
<section class="panel success-panel" id="success-section" hidden>

  <div class="success-heading">
    <div class="success-icon">✓</div>
    <h2>預約成功！</h2>
    <p>您的預約已成功建立，請確認以下資料。</p>
  </div>

  <div class="success-details">

    <div class="success-row">
      <span>學生姓名</span>
      <strong id="success-name"></strong>
    </div>

    <div class="success-row">
      <span>班級</span>
      <strong id="success-class"></strong>
    </div>

    <div class="success-row">
      <span>座號</span>
      <strong id="success-seat"></strong>
    </div>

    <div class="success-row">
      <span>預約日期</span>
      <strong id="success-date"></strong>
    </div>

    <div class="success-row">
      <span>預約時間</span>
      <strong id="success-time"></strong>
    </div>

  </div>

  <button type="button" id="continue-booking-button">
    繼續預約其他時段
  </button>

</section>
    
    <p class="notice">
      預約資料會儲存於系統，教師電子郵件通知功能尚未啟用。
    </p>
  </main>

  <footer>
    <p></p>
  </footer>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</body>
</html>
